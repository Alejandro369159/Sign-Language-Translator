<!DOCTYPE html>
<html lang="en">
  <head>
    <!--Sets up stylesheet and script file linking. Adds favicon and site title as well-->
    <meta charset="UTF-8" />
    <link rel="shortcut icon" type="image/png" href="Images/senas.png" />
    <title>Taductor De Señas</title>
    <link
      href="https://fonts.googleapis.com/css?family=Google+Sans:100,300,400,500"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/animate.css" />
    <script src="dist/build.js"></script>
  </head>

  <body>
    <!--Welcome Screen-->
    <div id="welcomeContainer" class="animated">
      <div id="welcomeScreen">
        <h1>Bienvenido al traductor de lenguaje de señas</h1>
        <h3 class="animated fadeInUp delay-2s">Sistemas Inteligentes PIA</h3>
      </div>
      <button id="proceedButton">INGRESAR</button>
    </div>

    <!--Title bar explains the stage of the program 
    (eg: instructions for Training, Prediction, and Video Chat)-->
    <div id="titleBar">
      <h1 id="stage">Entrena Gestos</h1>
      <h3 id="steps">
        Entrena aproximadamente 30 muestras de tu gesto de inicio y 30 de tu
        gesto de parada inactivo.
      </h3>
      <button id="nextButton" class="animated flash delay-3s">Siguiente</button>
      <button id="predictButton" class="animated flash slideInRight faster">
        Traducir
      </button>
      <button id="backButton" class="animated slideInLeft faster">
        Regresar A Entrenar
      </button>
      <button
        id="videoCallBtn"
        style="display: none"
        class="videoCallBtn animated slideInRight faster"
      >
        Video Llamada
      </button>
    </div>

    <!--Status bar shows the status of translation-->
    <div id="status">
      <p id="status-text">Status: NO LISTO</p>
    </div>

    <!--The Translator Window displays the video of the user, various buttons, and holds
    the training and translation screens-->
    <div id="translatorWindow">
      <!--Initial Training Holder creates the screen where users train Start and Stop Gestures-->
      <div id="initialTrainingHolder">
        <img
          src=""
          alt="checkmark"
          id="checkmark_startButton"
          class="checkMark"
        />
        <button id="startButton" class="trainButton">Iniciar Gesto</button>
        <button id="clear_startButton" class="clearButton">Limpiar</button>
        <h3 id="counter_startButton" class="counter"></h3>
        s
        <button id="stopButton" class="trainButton">Parar Gesto</button>
        <button id="clear_stopButton" class="clearButton">Limpiar</button>
        <h3 id="counter_stopButton" class="counter"></h3>
        <img
          src=""
          alt="checkmark"
          id="checkmark_stopButton"
          class="checkMark"
        />
      </div>

      <!--Video Holder displays the video feed from the user for training and translation.
        It also displays the Video Call feed once the user decides to do that-->
      <div id="videoHolder" class="videoContainerTrain">
        <video
          id="video"
          class="videoTrain"
          src=""
          muted
          autoplay
          playsinline
        ></video>
        <iframe
          src="https://tokbox.com/embed/embed/ot-embed.js?embedId=f37957b6-0f91-4fc5-90ce-f818cc85b5bf&room=DEFAULT_ROOM&iframe=true"
          width="650"
          height="370"
          allow="microphone; camera"
          id="videoCall"
        ></iframe>
      </div>

      <!--Training Holder displays the screen where users add and train new gestures-->
      <div id="trainingHolder">
        <h5 id="add-gesture">Agregar Texto</h5>
        <img
          src="Images/plus_sign.svg"
          alt="Plus Sign"
          id="plus_sign"
          class="plus_sign animated"
        />
        <form id="add-word" autocomplete="off">
          <input
            type="text"
            id="new-word"
            placeholder="Agregar Nuevo Titulo De Gesto"
          />
          <input
            type="submit"
            id="submit-word"
            value="Agregar Palabra &#9658;"
          />
        </form>
        <button id="doneRetrain" class="doneRetrain">Done Retraining</button>

        <div id="trainingCommands"></div>
      </div>

      <!--Translation Holder is where the Gesture Card and Text that was translated is displayed.-->
      <div id="translationHolder">
        <div id="translatedCard"></div>
        <h3 id="translationText">Empezar sena!</h3>
      </div>
    </div>

    <!--Trained Card Holder contains all the trained gestures' cards.
    It is outside the Training and Translation Windows because it has to be displayed on both screens-->
    <div id="trainedCardsHolder"></div>
  </body>
</html>
